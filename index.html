              <div style="margin-bottom: 18px;">
                <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">Solusi: Layar Live Preview kosong (blank) atau tidak merender di CodeDance IDE</h4>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: #334155;">Langkah cepat mengatasi kendala tampilan preview yang tidak muncul atau terjadi error sintaks pada proyek web.</p>

                <li style="margin-bottom: 6px;">Pastikan tag script di dalam index.html mengarah ke berkas JavaScript yang benar (contoh: &lt;script src="script.js"&gt;&lt;/script&gt;).</li>

                <li style="margin-bottom: 6px;">Hasil transkripsi dapat langsung diekspor menjadi berkas Word (.docx) atau Excel (.xlsx) dengan satu klik tombol "Export".</li>
                </ol>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #9a3412; background: #fff7ed; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ea580c;"><strong>Tips:</strong> Pastikan sudut foto tidak terlalu miring dan teks memiliki kontras yang cukup jelas terhadap latar belakang.</p>
              </div>
    
            </div>
  
            <div style="margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px dashed #e2e8f0;">
              <h3 style="font-size: 19px; font-weight: 700; color: #ea580c; margin: 0 0 12px 0;">6. Pemecahan Masalah & Troubleshooting</h3>
  
              <div style="margin-bottom: 18px;">
                <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">Solusi: Chatbot lambat merespons atau muncul pesan "Koneksi Terputus"</h4>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: #334155;">Langkah pemulihan cepat saat jaringan mengalami gangguan atau terjadi hambatan respons server.</p>
                <ol style="margin: 0 0 6px 20px; font-size: 13.5px; color: #475569; line-height: 1.6;">
                  <li style="margin-bottom: 6px;">Periksa koneksi internet perangkat Anda. Deepernova memerlukan koneksi aktif untuk terhubung ke mesin inferensi neural.</li>
                <li style="margin-bottom: 6px;">Jika respons terhenti di tengah jalan (streaming macet), klik tombol "Regenerate / Coba Lagi" di bawah pesan terakhir.</li>
                <li style="margin-bottom: 6px;">Cobalah muat ulang (reload) halaman browser. Jika menggunakan aplikasi Android, tutup aplikasi dari daftar recent apps lalu buka kembali.</li>
                <li style="margin-bottom: 6px;">Bersihkan cache peramban dengan menekan kombinasi tombol Ctrl + Shift + R (di Windows) atau Cmd + Shift + R (di Mac).</li>
                <li style="margin-bottom: 6px;">Pastikan Anda tidak menggunakan VPN yang memblokir request API atau memiliki latensi sangat tinggi.</li>
                </ol>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #9a3412; background: #fff7ed; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ea580c;"><strong>Tips:</strong> Mode Tamu (Guest Mode) tetap dapat menyimpan riwayat obrolan di penyimpanan lokal perangkat Anda tanpa risiko kehilangan pesan saat refresh.</p>
              </div>
    
              <div style="margin-bottom: 18px;">
                <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">Cara menggunakan fitur Alarm Mandiri dan sinkronisasi ke HP Android</h4>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: #334155;">Jadwalkan alarm dan pengingat aktivitas sehari-hari cukup dengan memberitahu asisten Deepernova.</p>
                <ol style="margin: 0 0 6px 20px; font-size: 13.5px; color: #475569; line-height: 1.6;">
                  <li style="margin-bottom: 6px;">Ketik perintah waktu di chat (contoh: "Ingatkan aku untuk rapat kerja jam 14.30 hari ini" atau "Pasang alarm bangun tidur jam 05.00 besok pagi").</li>
                <li style="margin-bottom: 6px;">AI Deepernova akan mendeteksi waktu dan membuat jadwal alarm di kalender in-app secara otonom.</li>
                <li style="margin-bottom: 6px;">Jika Anda menggunakan aplikasi Deepernova AI di Android (APK), sistem akan meminta izin notifikasi & alarm, lalu meneruskan jadwal langsung ke aplikasi jam/alarm bawaan smartphone Anda.</li>
                <li style="margin-bottom: 6px;">Anda dapat melihat seluruh jadwal aktif di menu "AI Calendar & Alarms".</li>
                </ol>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #9a3412; background: #fff7ed; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ea580c;"><strong>Tips:</strong> Pastikan izin "Alarms & Reminders" dan "Notifications" telah diaktifkan pada pengaturan aplikasi Deepernova di smartphone Android Anda.</p>
              </div>
    
              <div style="margin-bottom: 18px;">
                <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">Keamanan Data & Privasi: Apakah percakapan dan kode proyek saya aman di Deepernova?</h4>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: #334155;">Komitmen perlindungan data tingkat perbankan, enkripsi komunikasi, dan sistem proteksi anti-reverse engineering.</p>
                <ol style="margin: 0 0 6px 20px; font-size: 13.5px; color: #475569; line-height: 1.6;">
                  <li style="margin-bottom: 6px;">Enkripsi Data: Semua transmisi antara browser/aplikasi Anda dan server Deepernova dilindungi protokol HTTPS/TLS 1.3 dengan header keamanan modern (Helmet, CORP, COOP, Anti-Clickjacking).</li>
                <li style="margin-bottom: 6px;">Isolasi Sandboxing: Eksekusi kode di CodeDance IDE berjalan di sandbox iframe yang terisolasi ketat sehingga aman dari skrip berbahaya.</li>
                <li style="margin-bottom: 6px;">Perlindungan Anti-Reverse Engineering: Seluruh bundle aplikasi produksi diminifikasi secara agresif dengan penghapusan otomatis sourcemap dan console debug agar kode tidak dapat dibongkar oleh pihak luar.</li>
                <li style="margin-bottom: 6px;">Hak Cipta Sepenuhnya Milik Anda: Seluruh kode yang dibuat di CodeDance, karya visual AI, serta dokumen Word/Excel/PPT yang dihasilkan adalah 100% hak milik Anda untuk keperluan komersial maupun akademis.</li>
                <li style="margin-bottom: 6px;">Tidak Menjual Data: Deepernova Corp tidak pernah menjual data pribadi, riwayat percakapan, atau aset pengguna kepada pihak ketiga mana pun.</li>
                </ol>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #9a3412; background: #fff7ed; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ea580c;"><strong>Tips:</strong> Anda dapat menghapus seluruh riwayat percakapan Anda kapan saja melalui tombol "Hapus Riwayat" di bilah samping.</p>
              </div>
    
            </div>
  
            <div style="margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px dashed #e2e8f0;">
              <h3 style="font-size: 19px; font-weight: 700; color: #ea580c; margin: 0 0 12px 0;">7. Akun, Keamanan & Profil CEO</h3>
  
              <div style="margin-bottom: 18px;">
                <h4 style="font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">Perbedaan Mode Tamu (Guest Mode) dan Akun Terdaftar di Deepernova</h4>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: #334155;">Nikmati akses langsung tanpa login atau buat akun gratis untuk sinkronisasi multi-perangkat.</p>
                <ol style="margin: 0 0 6px 20px; font-size: 13.5px; color: #475569; line-height: 1.6;">
                  <li style="margin-bottom: 6px;">Mode Tamu (Guest Mode): Anda bisa langsung memakai seluruh fitur Deepernova (Chat, Vibe Coding, Bikin Gambar, Typernova) tanpa perlu mendaftar atau login. Riwayat disimpan di browser lokal perangkat.</li>
                <li style="margin-bottom: 6px;">Akun Terdaftar: 100% gratis selamanya. Keunggulannya: riwayat percakapan, proyek CodeDance, dokumen Typernova, dan memori otonom tersinkronisasi otomatis di semua laptop, PC, dan smartphone Anda.</li>
                <li style="margin-bottom: 6px;">Cara Mendaftar: Klik tombol "Masuk / Daftar" di pojok kanan atas, masukkan nama pengguna, email, dan kata sandi baru.</li>
                <li style="margin-bottom: 6px;">Jika Anda beralih dari Mode Tamu ke Akun Terdaftar, sistem CloudSync Deepernova akan secara otomatis menawarkan opsi penggabungan riwayat lokal ke akun Anda.</li>
                </ol>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #9a3412; background: #fff7ed; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ea580c;"><strong>Tips:</strong> Sangat disarankan membuat akun agar hasil karya gambar dan dokumen penting Anda dapat dibuka kembali kapan saja dari perangkat lain.</p>
