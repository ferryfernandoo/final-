            <h1 style="font-size: 30px; font-weight: 800; color: #0f172a; margin: 0 0 8px 0;">Deepernova AI — Platform Kecerdasan Buatan Gratis Indonesia</h1>
            <p style="font-size: 16px; color: #475569; margin: 0;"><strong>Founder & CEO:</strong> Ferry Fernando (<a href="https://instagram.com/ferryfernandoo_" target="_blank" rel="noopener">@ferryfernandoo_</a>)</p>
            <p style="font-size: 16px; color: #475569; margin: 4px 0 0 0;"><strong>Co-Founder & Vice CEO:</strong> Anju Malinton Pakpahan</p>

          <section style="margin-bottom: 32px;">
            <h2 style="font-size: 22px; font-weight: 700; color: #1e293b;">Tentang Deepernova AI & Komitmen Layanan Gratis</h2>
            <p>Deepernova AI adalah platform kecerdasan buatan (AI) yang dihadirkan secara <strong>100% gratis</strong> untuk membantu seluruh masyarakat, pelajar, mahasiswa, dan profesional di Indonesia. Platform ini didirikan oleh <strong>Ferry Fernando</strong> (Founder & CEO) bersama <strong>Anju Malinton Pakpahan</strong> (Vice CEO) di bawah naungan Deepernova Corp.</p>
            <p>Tujuan utama Deepernova AI adalah menyediakan alat bantu produktivitas yang cepat, mudah digunakan, dan terpercaya untuk pembuatan dokumen resmi, riset informasi, serta obrolan AI interaktif.</p>
          </section>

          <section style="margin-bottom: 32px;">
            <h2 style="font-size: 22px; font-weight: 700; color: #1e293b;">Transparansi Teknologi & Penggunaan API Pihak Ketiga</h2>
            <p>Untuk memastikan efisiensi peluncuran (launching efficiency), stabilitas layanan, serta performa maksimal bagi pengguna, Deepernova AI secara jujur dan transparan memanfaatkan integrasi API AI pihak ketiga yang teruji dan berkecepatan tinggi. Pendekatan ini memungkinkan platform untuk langsung memberikan manfaat nyata bagi pengguna dalam fase pengujian awal, sembari pengembangan model mandiri terus dilakukan secara berkelanjutan untuk tahap mendatang.</p>
          </section>

          <section style="margin-bottom: 32px;">
            <h2 style="font-size: 22px; font-weight: 700; color: #1e293b;">Layanan & Cara Penggunaan Deepernova AI</h2>
            <ul style="padding-left: 20px; margin-top: 12px;">
              <li style="margin-bottom: 12px;">
                <strong>1. Deepernova AI Agent (Pembuat Dokumen Word):</strong> 
                Membantu pengguna menyusun dokumen resmi Microsoft Word (.docx) bab demi bab secara terstruktur, lengkap dengan Daftar Isi bertitik-titik otomatis, grafik HD, dan tata letak gambar yang rapi.
              </li>
              <li style="margin-bottom: 12px;">
                <strong>2. ChatBot Assistant & Riset Web Real-time:</strong> 
                Fasilitas obrolan interaktif yang dilengkapi pencarian web real-time untuk memberikan jawaban berbasis data terbaru, serta fitur instan mengonversi hasil obrolan langsung menjadi dokumen Word hanya dalam 2 detik.
              </li>
              <li style="margin-bottom: 12px;">
                <strong>3. Pengolahan Data Excel & Presentasi PPTX:</strong> 
                Mendukung pembuatan dan pengolahan berkas spreadsheet Excel (.xlsx) serta ringkasan presentasi (.pptx).
              </li>
              <li style="margin-bottom: 12px;">
                <strong>4. Deepernova Universe 3D:</strong> 
                Antarmuka visual 3D interaktif untuk menjelajahi seluruh fitur dan layanan yang tersedia dalam ekosistem Deepernova AI.
              </li>
            </ul>
          </section>

          <section style="margin-bottom: 32px;">
            <h2 style="font-size: 22px; font-weight: 700; color: #1e293b;">Kepatuhan Format Dokumen</h2>
            <p>Deepernova AI menjamin 100% kepatuhan hasil ekspor berkas Microsoft Word (.docx), Excel (.xlsx), dan PowerPoint (.pptx) standar industri tanpa error unreadable content, sehingga berkas siap langsung digunakan untuk keperluan akademik maupun profesional.</p>
